# Samedia for iPhone and iPad. Generate the Xcode project with `xcodegen` (scripts/build-ios.sh does
# it). Signing: pass your own team at build time (DEVELOPMENT_TEAM=...), it is not kept here.
name: Samedia
options:
  bundleIdPrefix: io.samedia
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Samedia:
    type: application
    platform: iOS
    sources:
      - path: Samedia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.samedia.player
        PRODUCT_NAME: Samedia
        INFOPLIST_FILE: Samedia/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
