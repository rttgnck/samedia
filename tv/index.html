<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
  <title>Samedia</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- Samsung TV web APIs (AVPlay, productinfo, network). Absent in desktop browsers. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <div id="app">
    <div id="overlays"></div>
    <div id="toast"></div>
  </div>
  <script>
    // Desktop development: scale the 1920×1080 canvas to the window. The TV renders 1:1.
    (function () {
      if (typeof tizen !== 'undefined') return;
      function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var app = document.getElementById('app');
        app.style.transform = 'scale(' + s + ')';
        document.documentElement.style.width = document.body.style.width = (1920 * s) + 'px';
        document.documentElement.style.height = document.body.style.height = (1080 * s) + 'px';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
